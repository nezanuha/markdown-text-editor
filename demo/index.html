# Markdown Editor

## Introduction

Markdown is a lightweight markup language with plain-text formatting syntax. It is often used for writing documentation and creating content for web pages.

### Features of Markdown:
- Easy to learn and use
- Can be converted to HTML
- Supports basic text formatting

## Code Example

Here’s an example of a simple Python function:

```python
def greet(name):
    return f"Hello, {name}!"
```

Hi {{customer.name}} ({{customer.email}}), invoice {{invoice.number}} is dated {{today}}.
        </textarea>
        <button type="button" class="get-markdown btn-primary btn-sm self-end">Get Markdown</button>
    </form>
    
    <div class="border-t mt-5 space-y-3">
        <strong class="font-medium text-zinc-800 mt-3 block">Output</strong>
        <div class="output"></div>
    </div>

    <script type="module">
        import MarkdownEditor from '/src/components/Editor.js';

        window.addEventListener('DOMContentLoaded', () => {
        const options = {
            placeholder: 'Start writing...',
            mode: 'hybrid', // default plain
            variables: [
                { label: 'Today', value: '{{today}}', sample: '10 September 2026' },
                { label: 'Customer', items: [
                    { label: 'Name',  value: '{{customer.name}}',  sample: 'Hannes' },
                    { label: 'Email', value: '{{customer.email}}', sample: 'hannes@example.com' },
                ]},
                { label: 'Invoice No', value: '{{invoice.number}}' }, // no sample, stays raw
            ],
            // indent: {
            //     useTabs: false, // ❌ no tabs — use spaces
            //     tabSize: 2,     // number of spaces per indent
            //     autoClosingPairs: true
            // },
            onChange: (value) => {
                console.log('onChange fired:', value.slice(0, 50));
            },
        };

            // Now 'MarkdownEditor' is a constructor thanks to library.export: 'default'
            document.querySelectorAll(".editor").forEach(element => {
                const editor = new MarkdownEditor(element, options); 
            });

            document.querySelector(".get-markdown").addEventListener("click", function(e){
                const output = document.querySelector(".editor").value;
                console.log(output);
                document.querySelector(".output").innerHTML = `<pre>${output}</pre>`;
            });
        });
    </script>
